<section class="settings-page" data-settings-page aria-labelledby="settings-title">
    <h1 id="settings-title" class="settings-title">Settings</h1>
    <form data-settings-form>
        <div class="settings-currency-layout">
            <div class="settings-controls">
                <section class="settings-row settings-main-currency" aria-labelledby="settings-main-title">
                    <div class="settings-row__copy">
                        <h2 id="settings-main-title">Main currency</h2>
                        <p data-settings-currency-note>Choose once. Your main currency stays fixed.</p>
                    </div>
                    <div class="settings-fixed-currency" data-settings-fixed>
                        <div class="settings-fixed-currency__heading">
                            <strong data-settings-main-code>AED</strong>
                            <span class="settings-lock"><span class="settings-lock__icon" aria-hidden="true"></span> Fixed</span>
                        </div>
                        <span data-settings-main-name>United Arab Emirates Dirham</span>
                    </div>
                    <div class="settings-field settings-main-picker" data-settings-main-picker hidden>
                        <label class="settings-sr-only" for="settings-currency">Main currency</label>
                        <select id="settings-currency" name="currency" required></select>
                    </div>
                </section>
                <label class="settings-row settings-toggle">
                    <span class="settings-row__copy"><span class="settings-row__title">Show converted amounts</span><span class="settings-row__description">See a second currency below your balance.</span></span>
                    <input type="checkbox" name="showConverted" role="switch" aria-label="Show converted amounts">
                </label>
                <div data-settings-secondary>
                    <label class="settings-row settings-toggle">
                        <span class="settings-row__copy"><span class="settings-row__title">Select automatically</span><span class="settings-row__description">Choose a currency based on your region.</span></span>
                        <input type="checkbox" name="automatic" role="switch" aria-label="Select automatically" checked>
                    </label>
                    <p class="settings-note settings-auto-note" data-settings-auto-label></p>
                    <div class="settings-row settings-field" data-settings-manual>
                        <label for="settings-secondary-currency">Converted currency</label>
                        <select id="settings-secondary-currency" name="secondaryCurrency"></select>
                    </div>
                </div>
                <footer class="settings-footer">
                    <p class="settings-status" data-settings-status role="status" hidden></p>
                    <div class="settings-actions">
                        <button class="money-button" type="submit" data-settings-save>Save changes</button>
                        <button class="settings-cancel" type="button" data-settings-cancel>Cancel</button>
                    </div>
                </footer>
            </div>
            <aside class="settings-preview-column" aria-labelledby="settings-preview-title">
                <div class="settings-preview">
                    <h2 id="settings-preview-title">Balance preview</h2>
                    <span>Account balance</span>
                    <strong data-settings-preview></strong>
                    <p class="settings-note">Example balance</p>
                </div>
                <p class="settings-preview-note"><span aria-hidden="true">i</span> Conversions are for display only.</p>
            </aside>
        </div>
        <section class="settings-appearance" aria-labelledby="settings-theme-title">
            <h2 id="settings-theme-title">Theme</h2>
            <div class="settings-themes" role="group" aria-label="Theme">
                <button type="button" data-theme-choice="light" aria-pressed="true"><span aria-hidden="true">☀</span> Light</button>
                <button type="button" data-theme-choice="dark" aria-pressed="false"><span aria-hidden="true">☾</span> Dark</button>
            </div>
        </section>
    </form>
</section>
